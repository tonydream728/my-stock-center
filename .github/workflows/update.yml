name: Update Stock Center Dashboard

on:
  schedule:
    # 每天台灣時間下午 16:35 自動執行 (國際標準時間 08:35)
    - cron: '35 8 * * 1-5'
  workflow_dispatch: # 允許你隨時手動點擊按鈕更新網頁

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 複製專案程式碼
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝大數據所需套件
      run: |
        pip install requests pandas

    - name: 執行 AI 籌碼與價值驗證
      env:
        FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      run: python fetch_data.py

    - name: 自動將生成的 index.html 部署到網頁上
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        publish_branch: gh-pages
