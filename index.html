<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 價值存股決策中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card { transition: transform 0.2s; cursor: pointer; }
        .card:hover { transform: translateY(-5px); border-color: #0d6efd; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">📊 AI 價值存股決策中心</span>
        </div>
    </nav>
    <div class="container">
        <div id="app" class="row">
            <div class="text-center mt-5">正在從 data.json 讀取數據...</div>
        </div>
    </div>
    <script>
        // 自動讀取後端產出的 JSON
        fetch('data.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                const app = document.getElementById('app');
                app.innerHTML = data.map(s => `
                    <div class="col-md-4 mb-4">
                        <div class="card h-100 shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">${s.name} (${s.code})</h5>
                                <p class="card-text text-muted small">產業：${s.freq} | 本益比：${s.pe}</p>
                                <h6 class="text-primary">殖利率：${s.yield}%</h6>
                                <hr>
                                <div class="small"><b>歷史配息：</b><br>${s.history.map(h => `${h.year}: ${h.cash}`).join(' / ')}</div>
                            </div>
                        </div>
                    </div>`).join('');
            }).catch(err => {
                document.getElementById('app').innerHTML = '<div class="alert alert-danger">資料讀取失敗，請確認 data.json 是否已生成。</div>';
            });
    </script>
</body>
</html>
