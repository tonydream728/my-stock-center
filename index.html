<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>AI 價值存股決策中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container">
        <h2>📊 AI 價值存股決策中心</h2>
        <div id="app" class="row mt-4">讀取中...</div>
    </div>
    <script>
        fetch('data.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                const app = document.getElementById('app');
                app.innerHTML = data.map(s => `
                    <div class="col-md-4 mb-3">
                        <div class="card p-3 shadow-sm border-0">
                            <h5>${s.name} (${s.code})</h5>
                            <p class="mb-1 text-muted small">頻率: ${s.freq} | 本益比: ${s.pe}</p>
                            <h6 class="text-success">殖利率: ${s.yield}%</h6>
                            <div class="mt-2 small text-secondary">${s.history.map(h => `${h.year}: <b>${h.cash}</b>`).join(' | ')}</div>
                        </div>
                    </div>`).join('');
            });
    </script>
</body>
</html>
